name: Build Android App and Release

on:
  push:
    branches: [ main ]
    # لا داعي لبناء + نشر إصدار جديد لتعديل توثيق فقط
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish:
        description: 'انشر إصدارًا على Shop-app-updates (عطّلها لتجربة بناء فقط)'
        type: boolean
        default: true

# أقل صلاحيات ممكنة على مستوى الـ workflow؛ الـ job وحده يرفع الصلاحية لـ write
# (مطلوبة فقط لدفع CHANGELOG.md في الخطوة الأخيرة).
permissions:
  contents: read

# التزامن: cancel-in-progress كان يقتل التشغيل الأقدم في منتصف النشر، فيتركك مع
# إصدار منشور نصفه (APK واحد بدل اثنين) أو CHANGELOG غير مدفوع. الآن التشغيل
# الجاري يكمل للآخر، وأي تشغيلات تنتظر خلفه يبقى منها الأحدث فقط.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # يمنع Gradle من طباعة تلميحات تفاعلية، ويثبّت الترميز
      GRADLE_OPTS: -Dfile.encoding=UTF-8 -Dorg.gradle.console=plain
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # التاريخ الكامل مطلوب لتوليد ملاحظات الإصدار من الـ commits
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      # packages: '' يمنع التنزيل الافتراضي المكسور لحزمة "tools" (انظر تاريخ
      # الملف) لكن يضل يجهّز ANDROID_HOME ويقبل التراخيص.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # يطابق الحد الأدنى المطلوب لـ AGP 9.4 (Gradle 9.6.0+). كاش Gradle
      # والتبعيات يديره هذا الـ action تلقائيًا.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      # ─────────────────────────────────────────────────────────────────────
      # توقيع الإصدار (إصلاح مهم): بدون مفتاح ثابت كان AGP يولّد مفتاح debug
      # جديدًا في كل تشغيل على GitHub، فكل APK ينزل بتوقيع مختلف عن اللي قبله
      # وأندرويد يرفض التحديث فوق النسخة المثبّتة ("App not installed" /
      # تعارض توقيع). الحل: حط keystore الإصدار الحقيقي كـ Secrets (مرة وحدة):
      #   RELEASE_KEYSTORE_BASE64  ← base64 -w0 keystore/shopmanager-release.jks
      #   RELEASE_STORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      # إذا ما انحطّوا يكمل البناء كالسابق (مفتاح debug) مع تحذير واضح.
      # ─────────────────────────────────────────────────────────────────────
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            chmod 600 "$RUNNER_TEMP/signing/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
            echo "تم تجهيز مفتاح التوقيع من الـ Secrets."
          else
            echo "::warning title=توقيع غير ثابت::RELEASE_KEYSTORE_BASE64 غير معرّف — سيُوقَّع الإصدار بمفتاح debug مؤقت، وتحديث التطبيق من داخله سيفشل بتعارض التوقيع."
          fi

      # بناء واحد لكل المهام (تشغيل Gradle مرة وحدة بدل ٤ مرات، مع إعادة
      # استخدام الـ daemon والكاش) — الاختبارات أولًا، ثم الـ APKs.
      - name: Test and build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug assembleRelease --parallel --build-cache --stacktrace

      # فحص lint غير مانع (continue-on-error) كالسابق، لكنه يعمل بعد البناء
      # حتى لا يؤخر وصول الـ APK لو علق.
      - name: Run Android Lint (release)
        continue-on-error: true
        run: gradle lintRelease --parallel --build-cache

      - name: Locate APKs and checksums
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          [ -n "$DEBUG_APK" ] && [ -n "$RELEASE_APK" ] || { echo "::error::لم يتم العثور على أحد ملفات APK"; exit 1; }
          cp "$DEBUG_APK" shop-manager-debug.apk
          cp "$RELEASE_APK" shop-manager-release.apk
          sha256sum shop-manager-debug.apk shop-manager-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # يطبع بصمة شهادة التوقيع في ملخص التشغيل: قارن بينها وبين الإصدار
      # السابق — إذا اختلفت فالتحديث من داخل التطبيق لن يعمل.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner غير متوفر — تخطي التحقق"
            exit 0
          fi
          {
            echo "### 🔏 توقيع الإصدار"
            echo '```'
            "$APKSIGNER" verify --print-certs shop-manager-release.apk 2>&1 | grep -E "SHA-256|Signer #1 certificate DN" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify shop-manager-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.run_number }}
          path: |
            shop-manager-debug.apk
            shop-manager-release.apk
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30

      # ملف mapping الخاص بـ R8 — بدونه ما بتقدر تفك تشفير (deobfuscate) أي
      # crash قادم من نسخة release.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # ملاحظات الإصدار تلقائيًا من رسائل الـ commits (بدون ضجيج البناء/CI).
      # أمان: المُحدِّد العشوائي لـ GITHUB_OUTPUT يمنع commit بعنوان مصمَّم من
      # إنهاء القيمة مبكرًا وحقن مخرجات أخرى.
      - name: Generate changelog
        id: changelog
        if: github.event_name == 'push' || inputs.publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          NOISE_PATTERN='^(ci|chore|docs|build|test|merge)(\(.*\))?:|\b(ci|workflow|github action|gradle|jdk|keystore|signing|proguard|r8|assemble(debug|release)?|debug apk|release apk|changelog|readme|gitignore)\b'
          GITHUB_AUTOMSG_PATTERN='^(add files via upload|initial commit)$|^(update|create|delete) [^ ]+\.[A-Za-z0-9]+$|^rename .+ to .+$'
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          else
            RANGE="-15"
          fi
          UNRELEASED=$(git log $RANGE --no-merges --pretty=format:'%s' \
            | grep -viE "$NOISE_PATTERN" \
            | grep -viE "$GITHUB_AUTOMSG_PATTERN" \
            | sed 's/^/- /' || true)
          if [ -z "$UNRELEASED" ]; then
            UNRELEASED="- تحسينات وإصلاحات عامة"
          fi
          DELIM="CHANGELOG_$(openssl rand -hex 12)"
          {
            echo "notes<<$DELIM"
            echo "$UNRELEASED"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # النشر على مستودع Shop-app-updates العام (يتطلب Secret باسم
      # UPDATES_REPO_TOKEN). مقسوم لخطوتين لتجنب خطأ "Unicorn" لما يُرفع ملفان
      # كبيران بنفس الطلب مباشرة بعد إنشاء الإصدار.
      - name: Create GitHub Release on Shop-app-updates (with debug APK)
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          repository: slman14422003-create/Shop-app-updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: إصدار ${{ github.run_number }}
          body: |
            ## 🆕 ما الجديد بهذا الإصدار
            ${{ steps.changelog.outputs.notes }}

            ---
            📦 **shop-manager-release.apk** ← هاي النسخة المستخدمة تنزّلها عادةً: أصغر حجماً وأسرع بالتشغيل (مضغوطة/محسّنة عبر R8).
            🛠️ **shop-manager-debug.apk** ← نسخة تجريبية أكبر حجماً وأبطأ شوي، للاختبار فقط.
            🔐 **SHA256SUMS.txt** ← بصمات الملفات للتحقق من سلامتها.

            كلا الملفين موقّعين وجاهزين للتثبيت المباشر بعد تفعيل "مصادر غير معروفة" على الجهاز.
          files: |
            shop-manager-debug.apk
            SHA256SUMS.txt

      - name: Wait for release to settle
        if: github.event_name == 'push' || inputs.publish
        run: sleep 10

      - name: Upload release APK to the same release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          repository: slman14422003-create/Shop-app-updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          files: shop-manager-release.apk

      # تسجيل CHANGELOG.md. أمان: ملاحظات الإصدار تأتي من رسائل commits
      # (نص غير موثوق)، وكانت تُحقن مباشرة داخل سكربت bash عبر ${{ }} — يعني
      # commit بعنوان فيه $(...) أو علامة اقتباس كان ينفّذ أوامر بصلاحية كتابة
      # على المستودع. الآن تمر عبر متغير بيئة فقط، وتُستخدم كنص خام.
      # ومع التزامن الجديد: نعيد الضبط على آخر main قبل كل محاولة دفع حتى لا
      # يفشل push بسبب تشغيل سابق دفع قبلنا.
      - name: Record changelog entry
        if: (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/main'
        env:
          NOTES: ${{ steps.changelog.outputs.notes }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            {
              echo "## v1.0.${RUN_NUMBER} — $(date +%Y-%m-%d)"
              printf '%s\n' "$NOTES"
              echo ""
              cat CHANGELOG.md 2>/dev/null || true
            } > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "chore: record changelog for v1.0.${RUN_NUMBER} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "فشل الدفع (المحاولة $attempt) — إعادة المحاولة..."
            sleep $((attempt * 4))
          done
          echo "::warning::تعذّر دفع CHANGELOG.md بعد عدة محاولات (الإصدار نفسه نُشر بنجاح)."
