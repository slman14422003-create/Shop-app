name: Build and Release Public APK

# مستقل تمامًا عن full.yml (نسخة المطوّر): يبني ويُصدر نسخة public فقط،
# وبتشغيل يدوي حصرًا (لا يوجد push trigger هنا) - فالنشر الفعلي لمستخدمي
# نسخة public (تاج/إصدار جديد + GitHub Release يعتمد عليه نظام التحديث في
# التطبيق، راجع UpdateRepository) يصير فقط عند تشغيل هذا الووركفلو يدويًا
# بقرار واعٍ، لا تلقائيًا مع كل push أثناء تطوير/تجربة نسخة full.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: >-
          تحديد رقم الإصدار يدويًا (مثال: 1.0) بدل الزيادة التلقائية عن آخر
          تاج — استخدمها لإعادة ترقيم الإصدار (مثلاً بعد استقرار نسخة معيّنة
          وإرادة تسميتها "1.0" بصرف النظر عن آخر تاج مرفوع فعلاً). اتركها
          فارغة للسلوك المعتاد (١.٠ ← ١.١ ← ١.٢ ...).
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-public:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # نحتاج كامل تاريخ التاجات (tags) كي نتمكن من قراءة آخر رقم إصدار
          # وزيادته تلقائيًا (1.0 → 1.1 → 1.2 ...). fetch-depth: 0 = تاريخ كامل.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # لا نترك هذا الأكشن يوافق على التراخيص أو يثبّت الحزم؛ إصدارات
          # cmdline-tools الحديثة تطرح أسئلة ترخيص أكثر من الـ 10 الثابتة
          # التي يرسلها هذا الأكشن، فيفشل "sdkmanager --licenses" بخطأ
          # exit code 1. نقوم بالخطوتين يدويًا في الخطوة التالية بدل ذلك.
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept SDK licenses and install packages
        run: |
          set -euo pipefail
          # الأكشن android-actions/setup-android يضيف مجلد cmdline-tools/<إصدار
          # جديد نُزِّل للتو> إلى PATH صراحة - هذا هو المصدر الموثوق للنسخة
          # الصحيحة، لا البحث اليدوي. البحث بـ find + sort -V كان يختار خطأً
          # مجلد "latest" القديم المثبَّت مسبقًا على الـ runner (يحوي مستودعًا/
          # تراخيص غير ذات صلة إطلاقًا بأندرويد) لأن "sort -V" يضع كلمة
          # "latest" أعلى من أي رقم إصدار. نعتمد أولًا على PATH، ونستثني صراحة
          # مجلد latest من أي احتياط يدوي بديل.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -path '*/bin/*' | grep -v '/cmdline-tools/latest/' | sort -V | tail -1)
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -path '*/bin/*' | sort -V | tail -1)
            fi
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # yes ينتهي بـ SIGPIPE بمجرد إغلاق sdkmanager لمدخلاته، فقد يعطي
          # كود خروج غير صفري رغم نجاح قبول التراخيص فعليًا - نتجاهله هنا
          # عمدًا ونتحقق من النجاح الحقيقي عبر خطوة sdkmanager --install التالية.
          yes | "$SDKMANAGER" --licenses > /tmp/sdkmanager-licenses.log 2>&1 || true
          tail -n 30 /tmp/sdkmanager-licenses.log || true

          # ثابتون على أندرويد 16 (API 36) للاستقرار - حزمة android-37 غير
          # متوفرة بعد عبر مستودع sdkmanager بأي قناة.
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.1

      - name: Resolve next app version (زيادة تلقائية 1.0 → 1.1 → 1.2 ...)
        id: appver
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true

          MANUAL_VNAME="${{ github.event.inputs.version_name }}"

          if [ -n "$MANUAL_VNAME" ]; then
            NEXT_VNAME="$MANUAL_VNAME"
          else
            LAST_TAG=$(git tag --list 'v*' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n \
              | tail -1)

            if [ -z "$LAST_TAG" ]; then
              NEXT_VNAME="1.0"
            else
              MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
              MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
              MINOR=$((MINOR + 1))
              if [ "$MINOR" -ge 10 ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
              fi
              NEXT_VNAME="${MAJOR}.${MINOR}"
            fi
          fi

          VCODE=${{ github.run_number }}

          echo "version_name=$NEXT_VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "الإصدار السابق: ${LAST_TAG:-لا يوجد} → الإصدار الجديد: $NEXT_VNAME ($VCODE)"

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare release signing (optional in CI)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KS_PATH="$GITHUB_WORKSPACE/app/release.keystore.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
            keytool -list -keystore "$KS_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null

            # بصمة شهادة التوقيع (SHA-256/SHA-1) محسوبة مباشرة من نفس الـ
            # keystore السرّي أعلاه - لا سرّ إضافي مطلوب. تُغذّي متغيّر البناء
            # RELEASE_SIGNATURE_SHA256 (فحص إعادة التوقيع في SecurityUtils.kt)
            # وتُطبَع كمرجع لضبط Firebase/Google Sign-In/Play Console App Signing.
            CERT_INFO=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")
            SIG_SHA256=$(echo "$CERT_INFO" | awk -F': ' '/SHA256:/{gsub(":","",$2); print $2; exit}')
            SIG_SHA1=$(echo "$CERT_INFO" | awk -F': ' '/SHA1:/{gsub(":","",$2); print $2; exit}')

            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "sig_sha256=$SIG_SHA256" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found; building signed artifacts."
            echo "::notice::Release certificate SHA-256: $SIG_SHA256"
            echo "::notice::Release certificate SHA-1: $SIG_SHA1"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "store_file=" >> "$GITHUB_OUTPUT"
            echo "store_password=" >> "$GITHUB_OUTPUT"
            echo "key_alias=" >> "$GITHUB_OUTPUT"
            echo "key_password=" >> "$GITHUB_OUTPUT"
            echo "sig_sha256=" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Building unsigned artifacts for CI/testing only. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for a Play-ready signed build."
          fi

      - name: Build public-flavor release APK and App Bundle
        env:
          APP_VERSION_CODE: ${{ steps.appver.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.appver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          RELEASE_SIGNATURE_SHA256: ${{ steps.keystore.outputs.sig_sha256 }}
        run: |
          # نكهة public فقط - نسخة full لا تُبنى ولا تُنشَر هنا إطلاقًا
          # (راجع full.yml المنفصل لها).
          gradle :app:assemblePublicRelease :app:bundlePublicRelease --no-daemon --stacktrace

          echo "Build outputs:"
          find app/build/outputs/apk/public -name "*.apk"
          find app/build/outputs/bundle/publicRelease -name "*.aab"

      - name: Locate build outputs
        id: outputs
        run: |
          APK_PATHS=$(find app/build/outputs/apk/public -name "*.apk" 2>/dev/null | sort)
          AAB_PATHS=$(find app/build/outputs/bundle/publicRelease -name "*.aab" 2>/dev/null | sort)

          if [ -z "$APK_PATHS" ]; then
            echo "::error::No public-flavor APK found under app/build/outputs/apk/public/"
            exit 1
          fi

          if [ -z "$AAB_PATHS" ]; then
            echo "::warning::No AAB found under app/build/outputs/bundle/publicRelease/"
          fi

          {
            echo "apk_paths<<EOF"
            echo "$APK_PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "aab_paths<<EOF"
            echo "$AAB_PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Found APKs:"
          echo "$APK_PATHS"
          echo "Found AABs:"
          echo "$AAB_PATHS"

      - name: Verify APK/AAB signature (v2/v3 scheme + certificate check)
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            echo "== التحقق من التوقيع: $apk =="
            "$APKSIGNER" verify --print-certs -v "$apk"
          done <<< "${{ steps.outputs.outputs.apk_paths }}"

      - name: Generate SHA-256 checksums for release artifacts
        id: checksums
        run: |
          set -euo pipefail
          {
            echo "checksums<<EOF"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              sha256sum "$f"
            done <<< "${{ steps.outputs.outputs.apk_paths }}
          ${{ steps.outputs.outputs.aab_paths }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact (for direct download)
        uses: actions/upload-artifact@v7
        with:
          name: app-public-release-apk
          path: ${{ steps.outputs.outputs.apk_paths }}
          if-no-files-found: error

      - name: Upload App Bundle artifact (for Play Store upload)
        if: ${{ steps.outputs.outputs.aab_paths != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-public-release-bundle
          path: ${{ steps.outputs.outputs.aab_paths }}
          if-no-files-found: warn

      - name: Create GitHub Release (APK)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: الإصدار ${{ steps.appver.outputs.version_name }}
          body: |
            ## 📦 الإصدار ${{ steps.appver.outputs.version_name }}

            - رقم الإصدار: ${{ steps.appver.outputs.version_code }}
            - نسخة public (للمستخدم العادي) فقط.
            - إذا لم تُضبط أسرار التوقيع، فهذا البناء غير موقّع ومخصص للاختبار فقط.
            - بصمة شهادة التوقيع (SHA-256): `${{ steps.keystore.outputs.sig_sha256 }}`

            **بصمات SHA-256 لملفات هذا الإصدار (للتحقق من سلامتها بعد التنزيل):**
            ```
            ${{ steps.checksums.outputs.checksums }}
            ```
          generate_release_notes: true
          files: ${{ steps.outputs.outputs.apk_paths }}
          fail_on_unmatched_files: true

      - name: Publish public APK to the public releases repo
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          repository: slman14422003-create/Harbs-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: الإصدار ${{ steps.appver.outputs.version_name }}
          body: |
            موسوعة الأعشاب الطبية — الإصدار ${{ steps.appver.outputs.version_name }}
          files: ${{ steps.outputs.outputs.apk_paths }}
          fail_on_unmatched_files: true

      - name: Add App Bundle to GitHub Release
        if: ${{ steps.outputs.outputs.aab_paths != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          files: ${{ steps.outputs.outputs.aab_paths }}
          fail_on_unmatched_files: true

      - name: Cleanup Gradle cache
        if: always()
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/* 2>/dev/null || true
