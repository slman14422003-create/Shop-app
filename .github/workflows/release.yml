name: Build Android App and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # DYNAMIC CHANGELOG: the "Generate changelog" step below needs
          # real commit history to build the release notes from — the
          # default shallow checkout (depth 1, just the latest commit) has
          # no history to diff against, so `git log <range>` would always
          # come back empty. fetch-depth: 0 pulls full history once per
          # run, which is the only change needed here for that step to see
          # actual prior commits.
          fetch-depth: 0

      # JDK: bumped from 17 to 21 (the current LTS release — 17's successor,
      # 21 is a Long-Term-Support build so it keeps getting security/stability
      # patches for years, unlike a short-term feature release). AGP 8.5.2 +
      # Gradle 8.7 + Kotlin 1.9.24 (see build.gradle.kts) all officially
      # support running on JDK 21, so this is a safe bump with no other
      # version changes required.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # FIX: this used to only ever run `assembleDebug`, so every GitHub
      # Release only ever shipped the debug build — larger, unshrunk,
      # unobfuscated, and noticeably slower on entry-level phones (see
      # app/build.gradle.kts). `assembleRelease` now also runs, signed
      # with the CI-generated debug key (see build.gradle.kts's signing
      # comment) so it's a real installable APK, just smaller and faster.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Locate APKs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" shop-manager-debug.apk
          cp "$RELEASE_APK" shop-manager-release.apk

      # DYNAMIC RELEASE NOTES: the release body used to be one fixed block
      # of text on every single build ("بناء تلقائي..."), so
      # UpdateManifest.notes — which is literally this release's "body"
      # field, see parseGitHubRelease() in UpdateChecker.kt — showed the
      # exact same generic sentence in the in-app update dialog no matter
      # what had actually changed. This step instead reads the real commit
      # messages that landed since the last successful push (via
      # `github.event.before`, the SHA main pointed to right before this
      # push) and turns them into a bullet-point changelog, so every
      # release — and therefore every "تحديث متوفر" dialog on someone's
      # phone — describes what's actually new in THAT build.
      # `workflow_dispatch` runs (no "before" SHA) and first-ever pushes
      # (before = all-zeros) fall back to the last 15 commits so the step
      # never produces an empty changelog.
      - name: Generate changelog
        id: changelog
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            LOG=$(git log "${BEFORE_SHA}..${{ github.sha }}" --no-merges --pretty=format:'- %s (%h)')
          else
            LOG=$(git log -15 --no-merges --pretty=format:'- %s (%h)')
          fi
          if [ -z "$LOG" ]; then
            LOG="- تحسينات وإصلاحات عامة"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # CROSS-REPO PUBLISH: this main repo stays PRIVATE (your source code
      # never has to be public). The Release itself — tag + the .apk
      # assets — gets created directly on the separate, PUBLIC
      # "Shop-app-updates" repo instead of here, via softprops/action-gh-
      # release's `repository` input. Nothing is ever created in THIS
      # repo anymore; the app's UpdateChecker only ever looks at
      # Shop-app-updates (see UPDATES_REPO in UpdateChecker.kt), so this
      # is the one step that actually connects "push to main here" →
      # "app on people's phones sees a new update".
      #
      # Requires one secret set up once, in THIS repo's settings (Settings
      # → Secrets and variables → Actions → New repository secret):
      #   Name:  UPDATES_REPO_TOKEN
      #   Value: a GitHub Personal Access Token that has permission to
      #          create releases on Shop-app-updates specifically —
      #          the built-in secrets.GITHUB_TOKEN only ever has
      #          permission over the repo the workflow is running in, so
      #          it cannot publish to a different repo on its own.
      #
      # BUG FIXED: this used to create the release AND upload both .apk
      # files in one single step/request. GitHub occasionally hiccups
      # (returns its own generic "Unicorn" HTML error page instead of a
      # JSON response) when two sizeable assets get uploaded back-to-back
      # in the same request right after a release was just created — the
      # release object itself can take a few seconds to become fully
      # consistent across GitHub's edge/CDN layer before asset uploads
      # against it reliably succeed. Split into two steps: the release
      # is created (with the debug APK, since it's less critical) in the
      # first step, and — a little later, after the release has had time
      # to "settle" — the release APK (the one people actually install)
      # gets uploaded in its own step, targeting the SAME tag so it lands
      # as a second asset on the same release the first step made.
      # Splitting this way also means if only ONE of the two ever fails,
      # you only need to re-run that one step, not rebuild+reupload both.
      - name: Create GitHub Release on Shop-app-updates (with debug APK)
        uses: softprops/action-gh-release@v2
        with:
          repository: slman14422003-create/Shop-app-updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: إصدار ${{ github.run_number }}
          body: |
            ## 🆕 ما الجديد بهذا الإصدار
            ${{ steps.changelog.outputs.notes }}

            ---
            📦 **shop-manager-release.apk** ← هاي النسخة المستخدمة تنزّلها عادةً: أصغر حجماً وأسرع بالتشغيل (مضغوطة/محسّنة عبر R8).
            🛠️ **shop-manager-debug.apk** ← نسخة تجريبية أكبر حجماً وأبطأ شوي، للاختبار فقط.

            كلا الملفين موقّعين (بنفس مفتاح CI) وجاهزين للتثبيت المباشر بعد تفعيل "مصادر غير معروفة" على الجهاز.
          files: shop-manager-debug.apk

      - name: Wait for release to settle
        run: sleep 10

      - name: Upload release APK to the same release
        uses: softprops/action-gh-release@v2
        with:
          repository: slman14422003-create/Shop-app-updates
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          files: shop-manager-release.apk
