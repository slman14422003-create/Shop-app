name: Build Android App and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies (Cordova)
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build Android APK (debug, unsigned - installs directly)
        run: npx cordova build android

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" shop-manager.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: إصدار ${{ github.run_number }}
          body: |
            بناء تلقائي لتطبيق إدارة المحل (أندرويد) بعد آخر تحديث على الفرع main.
            هذا ملف APK غير موقّع (debug) يمكن تثبيته مباشرة على الجهاز بعد تفعيل "مصادر غير معروفة".
          files: shop-manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
