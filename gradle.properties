# PERF (سرعة البناء محليًا وعلى CI): ذاكرة أكبر لـ Gradle ولـ Kotlin daemon بدل
# 2GB الوحيدة (كانت تسبب GC متكرر مع Compose + Firebase)، و ParallelGC أسرع
# لعمليات البناء القصيرة من الافتراضي.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# تنفيذ مهام الموديولات/المهام المستقلة بالتوازي، وإعادة استخدام مخرجات المهام
# من الكاش (يعمل مع --build-cache في release.yml، ويخزّنه setup-gradle بين
# التشغيلات).
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: يتخطى مرحلة تهيئة سكربتات البناء كاملة بالتشغيلات
# المتكررة. problems=warn حتى لا يفشل البناء بسبب إضافة غير متوافقة بعد —
# يطبع تحذيرًا فقط ويرجع للمسار العادي.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 BUILT-IN-KOTLIN OPT-OUT (see root build.gradle.kts's plugins{}
# comment): AGP 9.0+ turns on "built-in Kotlin" + a new declarative DSL by
# default, which would require dropping org.jetbrains.kotlin.android
# entirely and rewriting this project's build scripts to the new DSL — an
# untested, source-incompatible migration. These two flags are Google's own
# documented, official way to keep AGP 9.x running the classic Kotlin
# plugin + classic DSL this project already uses, so the AGP version bump
# itself stays a safe, isolated change.
# TRACKING: per Google's migration guide this stops being honored in AGP
# 10.0 ("expected sometime in 2026") — when upgrading AGP past the 9.x
# line, budget time for the full built-in-Kotlin + new-DSL migration
# (developer.android.com/build/migrate-to-built-in-kotlin) instead of
# bumping the version number alone.
android.builtInKotlin=false
android.newDsl=false
# PERF (release APK size/speed): R8's "full mode" runs its stronger,
# whole-program optimizations (more aggressive inlining/removal across
# class boundaries) instead of the older, more conservative default mode
# kept for legacy compatibility. Safe here specifically because this app
# has no reflection-based (de)serialization for its own models (every
# Firestore read is doc.getString()/getDouble(), never toObject() — see
# the isMinifyEnabled comment in app/build.gradle.kts) and already ships
# explicit keep rules in proguard-rules.pro for the few libraries that do
# use reflection (Firebase). A smaller, more heavily-inlined release APK
# is fewer classes to load at cold start and less code for the interpreter/
# JIT to churn through before things feel warmed up.
android.enableR8.fullMode=true
